
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>لوحة التحكم</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>

<body class="bg-gray-100">

<!-- LOGIN -->

<div id="loginPage" class="min-h-screen flex items-center justify-center">

<div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md">

<h2 class="text-3xl font-bold text-center mb-6">
تسجيل دخول الإدارة
</h2>

<input
id="username"
type="text"
placeholder="اسم المستخدم"
class="w-full border p-3 rounded mb-4"
>

<input
id="password"
type="password"
placeholder="كلمة المرور"
class="w-full border p-3 rounded mb-4"
>

<button
onclick="login()"
class="w-full bg-teal-600 text-white p-3 rounded"
>
دخول
</button>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>

<!-- DASHBOARD -->

<div id="dashboardPage" class="hidden">

<header class="bg-teal-700 text-white p-5">

<div class="flex gap-3">

<a href="Bookings/Bookings.html"
class="bg-blue-600 px-4 py-2 rounded-lg text-white">
إدارة الحجوزات
</a>

<button
onclick="logout()"
class="bg-red-500 px-4 py-2 rounded-lg">
تسجيل الخروج
</button>

</div>

</header>

<div class="max-w-6xl mx-auto p-6">

<form id="offerForm"
class="bg-white p-6 rounded-xl shadow-lg mb-8">

<input type="hidden" id="offerId">

<div class="grid md:grid-cols-2 gap-4">

<input
id="title"
type="text"
placeholder="اسم الباقة"
required
class="border p-3 rounded"
>

<textarea
id="description"
placeholder="وصف الباقة"
class="border p-3 rounded h-28">
</textarea>

<textarea
id="features"
placeholder="مميزات الرحلة"
class="border p-3 rounded h-28">
</textarea>

<textarea
id="extraInfo"
placeholder="معلومات إضافية"
class="border p-3 rounded h-28">
</textarea>

<input
id="displayPriceText"
type="text"
placeholder="النص الظاهر أسفل الباقة (مثال: ابتداءً من 450 ريال)"
class="border p-3 rounded">

<input
id="image"
type="file"
accept="image/*"
class="border p-3 rounded"
>

</div>

<!-- الرحلات -->

<h3 class="text-xl font-bold mt-8 mb-4">
مواعيد الرحلات
</h3>

<div class="grid md:grid-cols-2 gap-4 mb-6">

<input
id="trip1Go"
placeholder="الرحلة الأولى - الذهاب"
class="border p-3 rounded">

<input
id="trip1Back"
placeholder="الرحلة الأولى - العودة"
class="border p-3 rounded">

<input
id="trip2Go"
placeholder="الرحلة الثانية - الذهاب"
class="border p-3 rounded">

<input
id="trip2Back"
placeholder="الرحلة الثانية - العودة"
class="border p-3 rounded">

<input
id="trip3Go"
placeholder="الرحلة الثالثة - الذهاب"
class="border p-3 rounded">

<input
id="trip3Back"
placeholder="الرحلة الثالثة - العودة"
class="border p-3 rounded">

<input
id="trip4Go"
placeholder="الرحلة الرابعة - الذهاب"
class="border p-3 rounded">

<input
id="trip4Back"
placeholder="الرحلة الرابعة - العودة"
class="border p-3 rounded">

</div>

<!-- أسعار الغرف -->

<h3 class="text-xl font-bold mt-8 mb-4">
أسعار الغرف
</h3>

<div class="grid md:grid-cols-3 gap-4 mb-6">

<input
id="price5"
placeholder="الخماسية المشتركة"
class="border p-3 rounded">

<input
id="price4"
placeholder="الرباعية الخاصة"
class="border p-3 rounded">

<input
id="price3"
placeholder="الثلاثية الخاصة"
class="border p-3 rounded">

<input
id="price2"
placeholder="الثنائية الخاصة"
class="border p-3 rounded">

<input
id="singlePrice"
placeholder="الخاصة (سرير واحد)"
class="border p-3 rounded">

<input
id="goOnlyPrice"
placeholder="ذهاب فقط"
class="border p-3 rounded">

<input
id="goReturnPrice"
placeholder="ذهاب وعودة"
class="border p-3 rounded">

</div>

<button
type="submit"
class="bg-teal-600 text-white px-6 py-3 rounded mt-4"
>
حفظ الباقة
</button>

</form>

<div class="bg-white rounded-xl shadow-lg overflow-hidden">

<table class="w-full">

<thead class="bg-gray-200">

<tr>

<th class="p-3">
الصورة
</th>

<th class="p-3">
اسم الباقة
</th>

<th class="p-3">
الوصف
</th>

<th class="p-3">
السعر
</th>

<th class="p-3">
إجراءات
</th>

</tr>

</thead>

<tbody id="offersTable"></tbody>

</table>

</div>



</div>

<script>



/* بيانات الدخول */

const ADMIN_USER = "admin";
const ADMIN_PASS = "123456";

/* تسجيل الدخول */

async function login(){

const username =
document.getElementById("username").value;

const password =
document.getElementById("password").value;

const { data, error } =
await supabaseClient
.from("admins")
.select("*")
.eq("username",username)
.eq("password",password)
.eq("role","dashboard")
.single();

if(error || !data){

alert("بيانات الدخول غير صحيحة");

return;

}

sessionStorage.setItem(
"adminLogged",
"true"
);

showDashboard();

}

function showDashboard(){

document
.getElementById("loginPage")
.classList.add("hidden");

document
.getElementById("dashboardPage")
.classList.remove("hidden");

loadOffers();
loadBookings();

}

if(
sessionStorage.getItem("adminLogged")
==="true"
)
{
showDashboard();
}

/* تحميل الباقات */

async function loadOffers(){

const { data } =
await supabaseClient
.from("offers")
.select("*")
.order("id",{ascending:false});

const table =
document.getElementById("offersTable");

table.innerHTML="";

data.forEach(offer=>{

table.innerHTML += `

<tr class="border-b">

<td class="p-3">
<img
src="${offer.image}"
class="w-24 h-24 object-cover rounded-lg border">
</td>

<td class="p-3 font-bold text-teal-700">
${offer.title}
</td>

<td class="p-3 max-w-xs">
<div class="line-clamp-3 text-gray-600">
${offer.description || ""}
</div>
</td>

<td class="p-3">
<span class="bg-yellow-100 text-yellow-800 px-3 py-1 rounded-full">

${offer.display_price_text
? offer.display_price_text
: "لا يوجد"}

</span>
</td>

<td class="p-3">

<button
onclick="editOffer(${offer.id})"
class="bg-blue-500 text-white px-3 py-1 rounded">
تعديل
</button>

<button
onclick="openCities(${offer.id},'${offer.title}')"
class="bg-purple-600 text-white px-3 py-1 rounded">
المدن والأسعار
</button>

<button
onclick="deleteOffer(${offer.id})"
class="bg-red-500 text-white px-3 py-1 rounded">
حذف
</button>

</td>

</tr>

`;

});

}

/* إضافة أو تعديل */

document
.getElementById("offerForm")
.addEventListener(
"submit",
async(e)=>{

e.preventDefault();

let imageUrl = "";

const file =
document.getElementById("image").files[0];

if(file){

const extension =
file.name.split(".").pop().toLowerCase();

const fileName =
`offer-${Date.now()}.${extension}`;

console.log("Uploading:", fileName);

const {
data: uploadData,
error: uploadError
} = await supabaseClient.storage
.from("offers")
.upload(
fileName,
file,
{
upsert: true
}
);

console.log("Upload Data:", uploadData);
console.log("Upload Error:", uploadError);

if(uploadError){

alert(
"خطأ رفع الصورة:\n" +
JSON.stringify(uploadError)
);

return;
}

const {
data: publicData
} = supabaseClient.storage
.from("offers")
.getPublicUrl(fileName);

imageUrl = publicData.publicUrl;

console.log("Image URL:", imageUrl);

}


const offerId =
document.getElementById("offerId").value;

const payload = {

title:
document.getElementById("title").value,

description:
document.getElementById("description").value,

features:
document.getElementById("features").value,

extra_info:
document.getElementById("extraInfo").value,

display_price_text:
document.getElementById("displayPriceText").value.trim(),




trip1:
`${document.getElementById("trip1Go").value} | ${document.getElementById("trip1Back").value}`,

trip2:
`${document.getElementById("trip2Go").value} | ${document.getElementById("trip2Back").value}`,

trip3:
`${document.getElementById("trip3Go").value} | ${document.getElementById("trip3Back").value}`,

trip4:
`${document.getElementById("trip4Go").value} | ${document.getElementById("trip4Back").value}`,

five_price:
parseInt(document.getElementById("price5").value || 0),

four_price:
parseInt(document.getElementById("price4").value || 0),

three_price:
parseInt(document.getElementById("price3").value || 0),

two_price:
parseInt(document.getElementById("price2").value || 0),

single_price:
parseInt(document.getElementById("singlePrice").value || 0),

transport_one_way:
parseInt(document.getElementById("goOnlyPrice").value || 0),

transport_round_trip:
parseInt(document.getElementById("goReturnPrice").value || 0)

};

if(imageUrl){
payload.image = imageUrl;
}

if(offerId){

await supabaseClient
.from("offers")
.update(payload)
.eq("id",offerId);

}else{

payload.image=imageUrl;

await supabaseClient
.from("offers")
.insert([payload]);

}

document
.getElementById("offerForm")
.reset();

document
.getElementById("offerId")
.value="";

loadOffers();

}
);

/* حذف */

async function deleteOffer(id){

if(!confirm("حذف الباقة؟"))
return;

await supabaseClient
.from("offers")
.delete()
.eq("id",id);

loadOffers();

}

/* تعديل */

async function editOffer(id){

const { data } =
await supabaseClient
.from("offers")
.select("*")
.eq("id",id)
.single();

document
.getElementById("offerId")
.value=data.id;

document
.getElementById("title")
.value=data.title;

document.getElementById("description").value =
data.description || "";

document.getElementById("features").value =
data.features || "";

document.getElementById("extraInfo").value =
data.extra_info || "";

// =========================
// تحميل مواعيد الرحلات
// =========================

const trip1 = (data.trip1 || "").split(" | ");
const trip2 = (data.trip2 || "").split(" | ");
const trip3 = (data.trip3 || "").split(" | ");
const trip4 = (data.trip4 || "").split(" | ");

document.getElementById("trip1Go").value = trip1[0] || "";
document.getElementById("trip1Back").value = trip1[1] || "";

document.getElementById("trip2Go").value = trip2[0] || "";
document.getElementById("trip2Back").value = trip2[1] || "";

document.getElementById("trip3Go").value = trip3[0] || "";
document.getElementById("trip3Back").value = trip3[1] || "";

document.getElementById("trip4Go").value = trip4[0] || "";
document.getElementById("trip4Back").value = trip4[1] || "";

document.getElementById("displayPriceText").value =
data.display_price_text || "";

document.getElementById("price5").value =
data.five_price || "";

document.getElementById("price4").value =
data.four_price || "";

document.getElementById("price3").value =
data.three_price || "";

document.getElementById("price2").value =
data.two_price || "";

document.getElementById("singlePrice").value =
data.single_price || "";

document.getElementById("goOnlyPrice").value =
data.transport_one_way || "";

document.getElementById("goReturnPrice").value =
data.transport_round_trip || "";

window.scrollTo({
top:0,
behavior:"smooth"
});

}

/* حذف حجز */

async function deleteBooking(id){

if(!confirm("حذف الحجز؟"))
return;

const { error } =
await supabaseClient
.from("bookings")
.delete()
.eq("id",id);

if(error){

alert("فشل حذف الحجز");
return;

}

loadBookings();

}


/* تحميل الحجوزات */

async function loadBookings(){

const { data, error } =
await supabaseClient
.from("bookings")
.select("*")
.order("id",{ascending:false});

if(error){

console.log(error);
return;

}

const table =
document.getElementById("bookingsTable");

table.innerHTML = "";

data.forEach(booking=>{

table.innerHTML += `

<tr class="border-b">

<td class="p-3">
${booking.package_name || "-"}
</td>

<td class="p-3">
${booking.full_name || "-"}
</td>

<td class="p-3">
${booking.phone || "-"}
</td>

<td class="p-3">
${booking.passengers || "-"}
</td>

<td class="p-3">
${booking.status || "جديد"}
</td>

<td class="p-3">
${new Date(
booking.created_at
).toLocaleString(
"ar-SA",
{
timeZone:"Asia/Riyadh",
year:"numeric",
month:"2-digit",
day:"2-digit",
hour:"2-digit",
minute:"2-digit",
second:"2-digit"
}
)}
</td>

<td class="p-3">

<a
href="https://wa.me/${booking.phone}"
target="_blank"
class="bg-green-500 text-white px-3 py-1 rounded">

واتساب

</a>

<button
onclick="deleteBooking(${booking.id})"
class="bg-red-500 text-white px-3 py-1 rounded mr-2">

حذف

</button>

</td>

</tr>

`;

});

}

function logout(){

sessionStorage.removeItem(
"adminLogged"
);

location.reload();

}


function closeCities(){

document
.getElementById("citiesModal")
.classList.add("hidden");

}


async function openCities(id,title){

document
.getElementById("citiesModal")
.classList.remove("hidden");

document
.getElementById("cityOfferId")
.value=id;

loadCities(id);

}

async function saveCity(){

const offerId =
document.getElementById("cityOfferId").value;

const { error } =
await supabaseClient
.from("cities")
.insert([{

offer_id: offerId,

city_name:
document.getElementById("cityName").value,

five_price:
document.getElementById("cityPrice5").value,

four_price:
document.getElementById("cityPrice4").value,

three_price:
document.getElementById("cityPrice3").value,

two_price:
document.getElementById("cityPrice2").value,

single_price:
document.getElementById("citySingle").value,

transport_one_way:
document.getElementById("cityGo").value,

transport_round_trip:
document.getElementById("cityReturn").value

}]);


if(error){

console.log(error);

alert("فشل إضافة المدينة");

return;

}

alert("تمت إضافة المدينة بنجاح");

document.getElementById("cityName").value="";
document.getElementById("cityPrice5").value="";
document.getElementById("cityPrice4").value="";
document.getElementById("cityPrice3").value="";
document.getElementById("cityPrice2").value="";
document.getElementById("citySingle").value="";
document.getElementById("cityGo").value="";
document.getElementById("cityReturn").value="";

loadCities(offerId);

}

async function loadCities(id){

const { data, error } =
await supabaseClient
.from("cities")
.select("*")
.eq("offer_id", id);

if(error){
console.log(error);
alert(error.message);
return;
}

if(!data){
return;
}

let html = `
<table class="w-full mt-5">
<tr class="bg-gray-200">
<th class="p-2">المدينة</th>
<th class="p-2">الخماسية</th>
<th class="p-2">الرباعية</th>
<th class="p-2">حذف</th>
</tr>
`;

data.forEach(city=>{

html += `
<tr class="border-b">
<td class="p-2">${city.city_name}</td>
<td class="p-2">${city.five_price}</td>
<td class="p-2">${city.four_price}</td>
<td class="p-2 space-x-2">

<button
onclick="editCity(${city.id})"
class="bg-blue-500 text-white px-3 py-1 rounded">

تعديل

</button>

<button
onclick="deleteCity(${city.id})"
class="bg-red-500 text-white px-3 py-1 rounded">

حذف

</button>

</td>
</tr>
`;

});

html += "</table>";

document.getElementById("citiesTable").innerHTML = html;

}

async function deleteCity(id){

if(!confirm("حذف المدينة؟"))
return;

await supabaseClient
.from("cities")
.delete()
.eq("id",id);

loadCities(
document.getElementById("cityOfferId").value
);

}

async function editCity(id){

const { data, error } =
await supabaseClient
.from("cities")
.select("*")
.eq("id",id)
.single();

if(error){
console.log(error);
return;
}

document.getElementById("cityId").value=data.id;

document.getElementById("cityName").value=data.city_name;

document.getElementById("cityPrice5").value=data.five_price;

document.getElementById("cityPrice4").value=data.four_price;

document.getElementById("cityPrice3").value=data.three_price;

document.getElementById("cityPrice2").value=data.two_price;

document.getElementById("citySingle").value=data.single_price;

document.getElementById("cityGo").value=data.transport_one_way;

document.getElementById("cityReturn").value=data.transport_round_trip;

document.querySelector(
'button[onclick="saveCity()"]'
).classList.remove("bg-green-600");

document.querySelector(
'button[onclick="saveCity()"]'
).classList.add("bg-blue-600");

document.querySelector(
'button[onclick="saveCity()"]'
).innerHTML="💾 حفظ التعديل";

}

async function saveCity() {

const offerId =
document.getElementById("cityOfferId").value;

const cityId =
document.getElementById("cityId").value;

const payload = {

offer_id: offerId,

city_name:
document.getElementById("cityName").value,

five_price:
document.getElementById("cityPrice5").value,

four_price:
document.getElementById("cityPrice4").value,

three_price:
document.getElementById("cityPrice3").value,

two_price:
document.getElementById("cityPrice2").value,

single_price:
document.getElementById("citySingle").value,

transport_one_way:
document.getElementById("cityGo").value,

transport_round_trip:
document.getElementById("cityReturn").value

};

let error;

if(cityId){

({ error } =
await supabaseClient
.from("cities")
.update(payload)
.eq("id", cityId));

}else{

({ error } =
await supabaseClient
.from("cities")
.insert([payload]));

}

if(error){

console.log(error);

alert(error.message);

return;

}

document.getElementById("cityId").value="";
document.getElementById("cityName").value="";
document.getElementById("cityPrice5").value="";
document.getElementById("cityPrice4").value="";
document.getElementById("cityPrice3").value="";
document.getElementById("cityPrice2").value="";
document.getElementById("citySingle").value="";
document.getElementById("cityGo").value="";
document.getElementById("cityReturn").value="";

document.querySelector(
'button[onclick="saveCity()"]'
).innerHTML="إضافة المدينة";

document.querySelector(
'button[onclick="saveCity()"]'
).classList.remove("bg-blue-600");

document.querySelector(
'button[onclick="saveCity()"]'
).classList.add("bg-green-600");

loadCities(offerId);

}

window.login = login;
window.editOffer = editOffer;
window.deleteOffer = deleteOffer;
window.deleteBooking = deleteBooking;
window.logout = logout;

</script>

<div id="citiesModal"
class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50">

<div class="bg-white p-6 rounded-xl w-full max-w-4xl">

<h2 class="text-2xl font-bold mb-5">
إدارة المدن
</h2>

<input type="hidden" id="cityOfferId">

<input type="hidden" id="cityId">

<div class="grid md:grid-cols-3 gap-3 mb-4">

<input id="cityName" placeholder="اسم المدينة" class="border p-3 rounded">

<input id="cityPrice5" placeholder="الخماسية" class="border p-3 rounded">

<input id="cityPrice4" placeholder="الرباعية" class="border p-3 rounded">

<input id="cityPrice3" placeholder="الثلاثية" class="border p-3 rounded">

<input id="cityPrice2" placeholder="الثنائية" class="border p-3 rounded">

<input id="citySingle" placeholder="الخاصة" class="border p-3 rounded">

<input id="cityGo" placeholder="ذهاب فقط" class="border p-3 rounded">

<input id="cityReturn" placeholder="ذهاب وعودة" class="border p-3 rounded">

</div>

<button
onclick="saveCity()"
class="bg-green-600 text-white px-6 py-3 rounded">

إضافة المدينة

</button>

<div id="citiesTable"
class="mt-6">
</div>

<button
onclick="closeCities()"
class="bg-red-500 text-white px-5 py-2 rounded mt-5">

إغلاق

</button>

</div>

</div>

</body>
</html>
