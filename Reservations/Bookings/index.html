<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>إدارة الحجوزات</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
.table-wrapper{
    overflow-x:auto;
}

.bookings-table{
    width:100%;
    border-collapse:collapse;
}

.bookings-table th,
.bookings-table td{
    white-space:nowrap;
    padding:10px 8px;
    font-size:14px;
    text-align:center;
}

/* اللاب والكمبيوتر */
@media (min-width:1024px){

    .bookings-table{
        min-width:100%;
    }

    .bookings-table th,
    .bookings-table td{
        font-size:13px;
        padding:8px 6px;
    }

}

/* الموبايل */
@media (max-width:1023px){

    .bookings-table{
        min-width:1300px;
    }

}
</style>

</head>

<body class="bg-gray-100">

<!-- LOGIN -->

<div id="loginPage"
class="min-h-screen flex items-center justify-center">

<div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md">

<h2 class="text-3xl font-bold text-center mb-6">
تسجيل دخول إدارة الحجوزات
</h2>

<input
id="username"
type="text"
placeholder="اسم المستخدم"
class="w-full border p-3 rounded mb-4">

<input
id="password"
type="password"
placeholder="كلمة المرور"
class="w-full border p-3 rounded mb-4">

<button onclick="loginBookings()"
class="w-full bg-teal-600 text-white p-3 rounded">
دخول
</button>

</div>

</div>

<!-- PAGE -->

<div id="bookingsPage" class="hidden">

<header class="bg-teal-700 text-white p-5">

    

<div class="flex justify-between items-center">

    <div class="flex gap-3">

        <a href="../dashboard.html"
        class="bg-blue-600 px-4 py-2 rounded-lg">
            الباقات
        </a>

        <button
        onclick="logoutBookings()"
        class="bg-red-500 px-4 py-2 rounded-lg">
            تسجيل الخروج
        </button>
<button
onclick="exportToExcel()"
class="bg-green-600 text-white px-4 py-2 rounded-lg">
📊 تصدير Excel
</button>

    </div>

    <div class="text-right">

        <h1 class="text-2xl font-bold mb-2">
            إدارة الحجوزات
        </h1>

        <div
        class="inline-flex items-center gap-2 bg-yellow-400 text-black px-4 py-2 rounded-xl shadow">

            👤

            <span id="adminName" class="font-bold">
            </span>

        </div>

    </div>

</div>

</header>

<div class="max-w-7xl mx-auto p-6">
<div class="grid md:grid-cols-4 gap-4 mb-6">

<div class="bg-white p-5 rounded-xl shadow text-center">
<div class="text-gray-500">
إجمالي الحجوزات
</div>
<div id="totalBookings"
class="text-3xl font-bold">
0
</div>
</div>

<div class="bg-white p-5 rounded-xl shadow text-center">
<div class="text-gray-500">
تمت المراجعة
</div>
<div id="reviewedBookings"
class="text-3xl font-bold text-green-600">
0
</div>
</div>

<div class="bg-white p-5 rounded-xl shadow text-center">
<div class="text-gray-500">
لم تتم المراجعة
</div>
<div id="pendingBookings"
class="text-3xl font-bold text-red-600">
0
</div>
</div>

<div class="bg-white p-5 rounded-xl shadow text-center">
<div class="text-gray-500">
الإيرادات
</div>
<div id="totalRevenue"
class="text-3xl font-bold text-blue-600">
0
</div>
</div>

</div>

<div class="bg-white rounded-xl shadow-lg">

<!-- البحث -->
<div class="p-4 flex gap-3 flex-wrap">

<input
id="searchName"
type="text"
placeholder="بحث بالاسم"
class="border p-2 rounded">

<input
id="searchPhone"
type="text"
placeholder="بحث برقم الجوال"
class="border p-2 rounded">

<select
id="statusFilter"
class="border p-2 rounded">

<option value="">
كل الحالات
</option>

<option value="تمت المراجعة">
تمت المراجعة
</option>

<option value="لم تتم المراجعة">
لم تتم المراجعة
</option>

</select>

<select
id="tripDateFilter"
class="border p-2 rounded">

<option value="">
كل مواعيد الرحلة
</option>

<option value="السبت | الاثنين">
السبت | الاثنين
</option>

<option value="الاثنين | الاربعاء">
الاثنين | الاربعاء
</option>

<option value="الاربعاء | الجمعة">
الاربعاء | الجمعة
</option>

<option value="الخميس | السبت">
الخميس | السبت
</option>

</select>


<input
type="date"
id="bookingDateFilter"
class="border p-2 rounded">

</div>

<!-- الجدول -->
<div class="bg-white rounded-xl shadow-lg">

<div class="table-wrapper">

<table class="bookings-table">

<thead class="bg-gray-200">

<tr>

<th class="p-3 whitespace-nowrap">الباقة</th>
<th class="p-3 whitespace-nowrap">موعد الرحلة</th>
<th class="p-3 whitespace-nowrap">نوع الحجز</th>
<th class="p-3 whitespace-nowrap">المدينة</th>
<th class="p-3 whitespace-nowrap">الاسم</th>
<th class="p-3 whitespace-nowrap">الجوال</th>
<th class="p-3 whitespace-nowrap">الأفراد</th>
<th class="p-3 whitespace-nowrap">الإجمالي</th>
<th class="p-3 whitespace-nowrap">الحالة</th>
<th class="p-3 whitespace-nowrap">التاريخ</th>
<th class="p-3 whitespace-nowrap">إجراءات</th>

</tr>

</thead>

<tbody id="bookingsTable"></tbody>

</table>

</div>

</div>



</div>

<script src="bookings-supabase.js"></script>
<script src="bookings.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</body>
</html>
